spring:
  application:
    name: msvc-orders
  cloud:
    config:
      enabled: true
      uri: ${SPRING_CLOUD_CONFIG_URI:http://configservice.microservices-fargate.local:8081}
      fail-fast: false
      retry:
        max-attempts: 20
        initial-interval: 2000
        multiplier: 1.5
        max-interval: 10000